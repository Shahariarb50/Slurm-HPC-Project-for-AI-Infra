<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1500" viewBox="0 0 1900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Slurm HPC component and port communication map</title>
  <desc id="desc">Each network connection is shown in a separate lane from initiating component through its port to the listening component.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#071b3d"/><stop offset="1" stop-color="#164785"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7c3aed"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .title{font:700 49px Arial,sans-serif;fill:#fff}.subtitle{font:24px Arial,sans-serif;fill:#d6e7ff}
      .node{fill:#fff;stroke:#bed0e8;stroke-width:2;rx:18;filter:url(#shadow)}.node-title{font:700 25px Arial,sans-serif;fill:#0f2550;text-anchor:middle}.node-text{font:18px Arial,sans-serif;fill:#41526d;text-anchor:middle}
      .section{font:700 28px Arial,sans-serif;fill:#0f2550}.column{font:700 18px Arial,sans-serif;fill:#53647d;letter-spacing:1px}
      .lane{fill:#fff;stroke:#d1dcea;stroke-width:2;rx:14}.source{font:700 21px Arial,sans-serif;fill:#17233d}.sub{font:17px Arial,sans-serif;fill:#596a82}.dest{font:700 21px Arial,sans-serif;fill:#17233d}.purpose{font:18px Arial,sans-serif;fill:#33445e}.port{font:700 19px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}.port-wide{font:700 16px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
      .local-title{font:700 24px Arial,sans-serif;fill:#075267}.local-text{font:700 19px Arial,sans-serif;fill:#17364a;text-anchor:middle}.note{font:19px Arial,sans-serif;fill:#263750}.note-bold{font:700 19px Arial,sans-serif;fill:#102a4d}.legend{font:700 17px Arial,sans-serif;fill:#31425d}
    </style>
  </defs>
  <rect width="1900" height="1500" fill="#f5f8fc"/>
  <rect width="1900" height="125" fill="url(#header)"/>
  <text x="950" y="58" class="title" text-anchor="middle">Slurm HPC Node-to-Node Communication</text>
  <text x="950" y="94" class="subtitle" text-anchor="middle">One connection per lane: initiator → port → listener</text>

  <!-- Component overview -->
  <text x="55" y="170" class="section">Cluster components</text>
  <g>
    <rect x="55" y="195" width="400" height="135" class="node"/><rect x="55" y="195" width="400" height="48" rx="16" fill="#fff0e8"/>
    <text x="255" y="227" class="node-title">USER / ADMIN</text><text x="255" y="274" class="node-text">Browser · SSH client</text><text x="255" y="303" class="node-text">Starts external connections</text>
    <rect x="495" y="195" width="400" height="135" class="node"/><rect x="495" y="195" width="400" height="48" rx="16" fill="#e8f1ff"/>
    <text x="695" y="227" class="node-title">LOGIN NODE</text><text x="695" y="274" class="node-text">SSH · Slurm client · SSSD</text><text x="695" y="303" class="node-text">NFSv4 client · MUNGE</text>
    <rect x="935" y="195" width="400" height="135" class="node"/><rect x="935" y="195" width="400" height="48" rx="16" fill="#e8f1ff"/>
    <text x="1135" y="227" class="node-title">CONTROLLER</text><text x="1135" y="274" class="node-text">Gateway · slurmctld · LDAP</text><text x="1135" y="303" class="node-text">NFS · accounting services</text>
    <rect x="1375" y="195" width="470" height="135" class="node"/><rect x="1375" y="195" width="470" height="48" rx="16" fill="#f0eaff"/>
    <text x="1610" y="227" class="node-title">GPU WORKERS 1 &amp; 2</text><text x="1610" y="274" class="node-text">slurmd · SSSD · NFSv4 client</text><text x="1610" y="303" class="node-text">MUNGE · GPU/NVML</text>
  </g>

  <!-- Flow header -->
  <text x="55" y="385" class="section">Network flows</text>
  <text x="82" y="425" class="column">INITIATOR / SOURCE</text><text x="690" y="425" class="column" text-anchor="middle">PORT &amp; DIRECTION</text><text x="935" y="425" class="column">LISTENER / DESTINATION</text><text x="1480" y="425" class="column">PURPOSE</text>

  <!-- Lane 1 -->
  <rect x="55" y="445" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="486" r="14" fill="#ea580c"/><text x="110" y="480" class="source">Browser</text><text x="110" y="506" class="sub">User workstation</text>
  <path d="M545 486H880" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow-orange)"/><rect x="650" y="462" width="125" height="42" rx="21" fill="#ea580c"/><text x="712" y="483" class="port">TCP 5011</text>
  <text x="935" y="480" class="dest">Controller · Slurm Web Gateway</text><text x="935" y="506" class="sub">HTTP listener configured by this repository</text><text x="1480" y="493" class="purpose">Open the management web UI</text>

  <!-- Lane 2 -->
  <rect x="55" y="537" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="578" r="14" fill="#ea580c"/><text x="110" y="572" class="source">SSH client</text><text x="110" y="598" class="sub">User or administrator</text>
  <path d="M545 578H880" stroke="#ea580c" stroke-width="6" marker-end="url(#arrow-orange)"/><rect x="670" y="554" width="85" height="42" rx="21" fill="#ea580c"/><text x="712" y="575" class="port">TCP 22</text>
  <text x="935" y="572" class="dest">Login node · OpenSSH server</text><text x="935" y="598" class="sub">Or another explicitly managed server</text><text x="1480" y="585" class="purpose">Interactive login and administration</text>

  <!-- Lane 3 -->
  <rect x="55" y="629" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="670" r="14" fill="#2563eb"/><text x="110" y="664" class="source">Login node · Slurm client</text><text x="110" y="690" class="sub">sbatch · squeue · scontrol · srun</text>
  <path d="M545 670H880" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/><rect x="665" y="646" width="95" height="42" rx="21" fill="#2563eb"/><text x="712" y="667" class="port">TCP 6817</text>
  <text x="935" y="664" class="dest">Controller · slurmctld</text><text x="935" y="690" class="sub">Central Slurm controller listener</text><text x="1480" y="677" class="purpose">Submit and query jobs or allocations</text>

  <!-- Lane 4 -->
  <rect x="55" y="721" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="762" r="14" fill="#2563eb"/><text x="110" y="756" class="source">Workers · slurmd</text><text x="110" y="782" class="sub">Worker 1 and Worker 2</text>
  <path d="M545 762H880" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/><rect x="665" y="738" width="95" height="42" rx="21" fill="#2563eb"/><text x="712" y="759" class="port">TCP 6817</text>
  <text x="935" y="756" class="dest">Controller · slurmctld</text><text x="935" y="782" class="sub">Connection initiated by each worker</text><text x="1480" y="769" class="purpose">Registration, status and controller RPC</text>

  <!-- Lane 5 -->
  <rect x="55" y="813" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="854" r="14" fill="#2563eb"/><text x="110" y="848" class="source">Controller · slurmctld</text><text x="110" y="874" class="sub">Central scheduler</text>
  <path d="M545 854H880" stroke="#2563eb" stroke-width="6" marker-end="url(#arrow-blue)"/><rect x="665" y="830" width="95" height="42" rx="21" fill="#2563eb"/><text x="712" y="851" class="port">TCP 6818</text>
  <text x="935" y="848" class="dest">Workers · slurmd</text><text x="935" y="874" class="sub">Compute-daemon listener on each worker</text><text x="1480" y="861" class="purpose">Launch and control compute work</text>

  <!-- Lane 6 -->
  <rect x="55" y="905" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="946" r="14" fill="#7c3aed"/><text x="110" y="940" class="source">Login and workers · SSSD</text><text x="110" y="966" class="sub">LDAP identity clients</text>
  <path d="M545 946H880" stroke="#7c3aed" stroke-width="6" marker-end="url(#arrow-purple)"/><rect x="642" y="922" width="140" height="42" rx="21" fill="#7c3aed"/><text x="712" y="943" class="port">389 / 636</text>
  <text x="935" y="940" class="dest">Controller · OpenLDAP</text><text x="935" y="966" class="sub">389 LDAP · 636 LDAPS</text><text x="1480" y="953" class="purpose">Resolve users, groups and roles</text>

  <!-- Lane 7 -->
  <rect x="55" y="997" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="1038" r="14" fill="#16a34a"/><text x="110" y="1032" class="source">Login and workers · NFSv4 client</text><text x="110" y="1058" class="sub">Mount request from every client node</text>
  <path d="M545 1038H880" stroke="#16a34a" stroke-width="6" marker-end="url(#arrow-green)"/><rect x="665" y="1014" width="95" height="42" rx="21" fill="#16a34a"/><text x="712" y="1035" class="port">TCP 2049</text>
  <text x="935" y="1032" class="dest">Controller · NFS server</text><text x="935" y="1058" class="sub">Shared storage listener</text><text x="1480" y="1045" class="purpose">Mount and use /shared/home</text>

  <!-- Lane 8 -->
  <rect x="55" y="1089" width="1790" height="82" class="lane"/>
  <circle cx="82" cy="1130" r="14" fill="#64748b"/><text x="110" y="1124" class="source">Login / allocated job processes</text><text x="110" y="1150" class="sub">srun · MPI · NCCL · application</text>
  <path d="M545 1130H880" stroke="#64748b" stroke-width="6" stroke-dasharray="14 9" marker-end="url(#arrow-gray)"/><rect x="562" y="1106" width="300" height="42" rx="21" fill="#64748b"/><text x="712" y="1127" class="port-wide">DYNAMIC / SITE-DEFINED</text>
  <text x="935" y="1124" class="dest">Allocated GPU workers</text><text x="935" y="1150" class="sub">Job-step and application listeners</text><text x="1480" y="1137" class="purpose">Distributed job and data traffic</text>

  <!-- Local-only flows -->
  <rect x="55" y="1215" width="1185" height="220" rx="20" fill="#e8fbff" stroke="#0891b2" stroke-width="3"/>
  <text x="85" y="1255" class="local-title">Controller-local services — not node-to-node firewall ports</text>
  <g transform="translate(90 1292)">
    <rect width="275" height="58" rx="12" fill="#fff" stroke="#8bd7e6"/><text x="137" y="36" class="local-text">Slurm Web Agent</text>
    <path d="M275 29H410" stroke="#0891b2" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="343" y="17" class="local-text">127.0.0.1:6820</text>
    <rect x="410" width="230" height="58" rx="12" fill="#fff" stroke="#8bd7e6"/><text x="525" y="36" class="local-text">slurmrestd</text>
    <rect y="78" width="275" height="58" rx="12" fill="#fff" stroke="#8bd7e6"/><text x="137" y="114" class="local-text">slurmctld</text>
    <path d="M275 107H410" stroke="#0891b2" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="343" y="95" class="local-text">6819</text>
    <rect x="410" y="78" width="230" height="58" rx="12" fill="#fff" stroke="#8bd7e6"/><text x="525" y="114" class="local-text">slurmdbd</text>
    <path d="M640 107H775" stroke="#0891b2" stroke-width="5" marker-end="url(#arrow-blue)"/><text x="707" y="95" class="local-text">3306</text>
    <rect x="775" y="78" width="230" height="58" rx="12" fill="#fff" stroke="#8bd7e6"/><text x="890" y="114" class="local-text">MariaDB</text>
  </g>

  <!-- Notes -->
  <rect x="1275" y="1215" width="570" height="220" rx="20" fill="#fff" stroke="#bfd0e7" stroke-width="2"/>
  <text x="1310" y="1255" class="local-title">No-port components</text>
  <text x="1310" y="1300" class="note-bold">MUNGE</text><text x="1410" y="1300" class="note">Same shared key; local signing and verification.</text>
  <text x="1310" y="1345" class="note-bold">GPU/NVML</text><text x="1435" y="1345" class="note">Local hardware discovery and accounting.</text>
  <text x="1310" y="1390" class="note-bold">Rule</text><text x="1380" y="1390" class="note">Arrows always show initiator → listener.</text>

  <!-- Legend -->
  <g transform="translate(70 1472)">
    <circle cx="0" cy="0" r="9" fill="#2563eb"/><text x="17" y="6" class="legend">Slurm</text>
    <circle cx="125" cy="0" r="9" fill="#7c3aed"/><text x="142" y="6" class="legend">LDAP</text>
    <circle cx="250" cy="0" r="9" fill="#16a34a"/><text x="267" y="6" class="legend">NFS</text>
    <circle cx="365" cy="0" r="9" fill="#ea580c"/><text x="382" y="6" class="legend">Web / SSH</text>
    <circle cx="535" cy="0" r="9" fill="#0891b2"/><text x="552" y="6" class="legend">Controller-local</text>
    <line x1="755" y1="0" x2="825" y2="0" stroke="#64748b" stroke-width="5" stroke-dasharray="12 8"/><text x="845" y="6" class="legend">Dynamic application traffic</text>
  </g>
</svg>
